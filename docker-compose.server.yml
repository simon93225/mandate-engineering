services:

  db:
    image: mariadb:11.4
    container_name: mandate-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
      # Auto-imports the site DB the first time the volume is created.
      - ./wordpress.sql:/docker-entrypoint-initdb.d/wordpress.sql:ro
    networks:
      - mandate-network

  wordpress:
    image: wordpress:latest
    container_name: mandate-wordpress
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      # Sets the site URL to the server IP so it works over the internet.
      # Change SERVER_IP in .env to your public IP/domain before starting.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://${SERVER_IP}');
        define('WP_SITEURL', 'http://${SERVER_IP}');
    volumes:
      - ./wp-content:/var/www/html/wp-content
    networks:
      - mandate-network

volumes:
  db_data:

networks:
  mandate-network:
    driver: bridge
