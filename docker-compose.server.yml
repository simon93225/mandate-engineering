services:

  db:
    image: mariadb:11.4
    container_name: mandate-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
      # Auto-imports the site DB the first time the volume is created.
      - ./wordpress.sql:/docker-entrypoint-initdb.d/wordpress.sql:ro
    networks:
      - mandate-network

  wordpress:
    image: wordpress:latest
    container_name: mandate-wordpress
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      # Sets the site URL to the server IP so it works over the internet.
      # Change SERVER_IP in .env to your public IP/domain before starting.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://${SERVER_IP}');
        define('WP_SITEURL', 'http://${SERVER_IP}');
        define('WP_DEBUG', false);
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISALLOW_FILE_EDIT', true);
        define('AUTH_KEY', '909ccb518d119233236a4c60d53cc927438206fb');
        define('SECURE_AUTH_KEY', '3c68272a5afdd5e03a44c3a9972b41b6c3f3c97c');
        define('LOGGED_IN_KEY', 'b3e21243fa9a7b056cc17dbd038ef060b740376a');
        define('NONCE_KEY', '0a85ad4c6dc3e485e298755b0e030c9baf55f2fe');
        define('AUTH_SALT', 'c56c6e7bac237bbfd622d081f511187df3ca8585');
        define('SECURE_AUTH_SALT', 'c1c343c5948106f0892018c0212fc0c7ad98d0d3');
        define('LOGGED_IN_SALT', '6f71913e8970ad8d160a5d124f72b2d9f85335b4');
        define('NONCE_SALT', 'bb700d8f10168f7ed30574b31f3b1de877208863');
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./.htaccess:/var/www/html/.htaccess:ro
    networks:
      - mandate-network

volumes:
  db_data:

networks:
  mandate-network:
    driver: bridge
